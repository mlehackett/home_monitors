<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Howbinsea — Swing Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --navy-deep:#081820;
  --navy:#0d232d;
  --panel:#102a35;
  --panel-line:#1c3f4c;
  --teal:#3f9aa8;
  --teal-dim:#245a66;
  --steel:#7691ad;
  --steel-bright:#a9c3dd;
  --rust:#d9683d;
  --cream:#eee6d6;
  --cream-dim:#9fb3b8;
  --muted:#7fa0a8;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at 20% -10%, #123543 0%, transparent 55%),
    linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 100%);
  color:var(--cream);
  font-family:'IBM Plex Mono', monospace;
  padding:36px 20px 60px;
  min-height:100vh;
}

.wrap{max-width:980px;margin:0 auto;}

/* ---- login screen ---- */
.login-screen{
  position:fixed; inset:0; z-index:1000;
  background:rgba(8,24,32,0.97);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.3rem;
  padding:20px;
}
.login-screen.hidden{display:none;}
.login-title{
  font-family:'Oswald', sans-serif;
  font-size:2rem; font-weight:700;
  letter-spacing:0.08em; text-transform:uppercase;
  color:var(--cream);
}
.login-subtitle{font-size:0.75rem; color:var(--muted); letter-spacing:0.08em; margin-top:-0.8rem; text-align:center;}
.login-form{display:flex; flex-direction:column; gap:0.8rem; width:300px;}
.login-field{display:flex; flex-direction:column; gap:0.3rem;}
.login-field label{font-size:0.62rem; letter-spacing:0.14em; color:var(--muted); text-transform:uppercase;}
.login-field input{
  background:var(--panel); border:1px solid var(--panel-line); border-radius:2px;
  color:var(--cream); font-family:'IBM Plex Mono', monospace; font-size:0.85rem;
  padding:0.6rem 0.7rem; outline:none; transition:border-color 0.2s;
}
.login-field input:focus{border-color:var(--teal);}
.login-btn{
  margin-top:0.4rem; background:var(--teal); border:none; border-radius:2px;
  color:#081820; font-family:'Oswald', sans-serif; font-weight:600; font-size:1rem;
  letter-spacing:0.1em; text-transform:uppercase; padding:0.7rem; cursor:pointer; transition:opacity 0.2s;
}
.login-btn:hover{opacity:0.85;}
.login-error{font-size:0.68rem; color:var(--rust); text-align:center; min-height:1em;}
.login-reset{
  font-size:0.62rem; color:var(--muted); letter-spacing:0.06em; cursor:pointer;
  text-decoration:underline; background:none; border:none; font-family:'IBM Plex Mono', monospace;
}

/* ---- header ---- */
.masthead{
  border:1px solid var(--panel-line);
  border-radius:2px;
  padding:26px 28px 22px;
  position:relative;
  background:linear-gradient(180deg, rgba(63,154,168,0.06), transparent 60%);
  overflow:hidden;
}
.masthead::before{
  content:"";
  position:absolute; inset:0;
  background-image:repeating-linear-gradient(90deg, rgba(63,154,168,0.05) 0 1px, transparent 1px 40px);
  pointer-events:none;
}
.top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
.eyebrow{
  font-family:'Oswald', sans-serif;
  font-size:11px;
  letter-spacing:0.32em;
  text-transform:uppercase;
  color:var(--steel-bright);
  margin:0 0 10px;
  display:flex; align-items:center; gap:8px;
}
.status-dot{
  display:inline-block; width:6px; height:6px; background:var(--teal); border-radius:50%;
  box-shadow:0 0 6px var(--teal); animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.75);}}
h1{
  font-family:'Oswald', sans-serif;
  font-weight:700;
  font-size:clamp(32px,6vw,52px);
  letter-spacing:0.01em;
  text-transform:uppercase;
  margin:0 0 6px;
  color:var(--cream);
  line-height:1;
}
.subtitle{
  font-size:13.5px;
  color:var(--muted);
  margin:0;
  letter-spacing:0.02em;
}
.subtitle b{color:var(--teal);font-weight:600;}

.refresh-btn{
  background:var(--panel); border:1px solid var(--panel-line); border-radius:2px;
  color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:10.5px;
  letter-spacing:0.08em; text-transform:uppercase; padding:8px 12px; cursor:pointer;
  white-space:nowrap;
}
.refresh-btn:hover{color:var(--cream); border-color:var(--teal);}

.headline-stats{
  display:flex;
  gap:0;
  margin-top:22px;
  border-top:1px solid var(--panel-line);
  padding-top:16px;
  flex-wrap:wrap;
}
.hstat{
  flex:1;
  min-width:110px;
  padding:0 18px 0 0;
  border-right:1px solid var(--panel-line);
}
.hstat:last-child{border-right:none;}
.hstat .num{
  font-family:'Oswald', sans-serif;
  font-size:26px;
  font-weight:600;
  color:var(--steel-bright);
  line-height:1.1;
}
.hstat .lbl{
  font-size:9.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:3px;
}

/* ---- section labels ---- */
.section-lbl{
  font-family:'Oswald', sans-serif;
  font-size:12px;
  letter-spacing:0.24em;
  text-transform:uppercase;
  color:var(--muted);
  margin:40px 0 12px;
  display:flex;
  align-items:center;
  gap:10px;
}
.section-lbl::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--panel-line);
}

/* ---- chart panel ---- */
.chart-panel{
  border:1px solid var(--panel-line);
  border-radius:2px;
  background:var(--panel);
  padding:18px 18px 10px;
  position:relative;
  min-height:120px;
}
.chart-caption{
  font-size:11px;
  color:var(--muted);
  margin:10px 2px 0;
  line-height:1.6;
}
.chart-caption .swatch{
  display:inline-block;width:9px;height:9px;border-radius:1px;margin:0 5px 0 14px;position:relative;top:1px;
}
.chart-caption .swatch:first-child{margin-left:0;}
svg text{font-family:'IBM Plex Mono', monospace;}

/* ---- gauges ---- */
.gauges{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-top:16px;
}
.gauge{
  border:1px solid var(--panel-line);
  background:var(--panel);
  border-radius:2px;
  padding:16px 16px 14px;
}
.gauge .g-lbl{
  font-size:9.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
}
.gauge .g-val{
  font-family:'Oswald', sans-serif;
  font-size:24px;
  font-weight:600;
  color:var(--cream);
}
.gauge .g-val small{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:var(--muted);
  font-weight:400;
  margin-left:5px;
}
.gauge.accent .g-val{color:var(--rust);}
.gauge .g-sub{font-size:10.5px;color:var(--teal);margin-top:5px;}

/* ---- log table ---- */
.log-panel{
  border:1px solid var(--panel-line);
  background:var(--panel);
  border-radius:2px;
  max-height:280px;
  overflow-y:auto;
}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{
  position:sticky;top:0;
  background:#132f3b;
  text-align:left;
  padding:9px 14px;
  font-family:'Oswald', sans-serif;
  font-size:10px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  border-bottom:1px solid var(--panel-line);
}
tbody td{
  padding:7px 14px;
  border-bottom:1px solid rgba(28,63,76,0.5);
  color:var(--cream-dim);
}
tbody tr:hover{background:rgba(63,154,168,0.06);}
td.mono-val{color:var(--cream);}
td.dev-val{color:var(--rust);}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--panel);}
::-webkit-scrollbar-thumb{background:var(--panel-line);border-radius:4px;}

.status-line{
  font-size:10.5px; color:var(--muted); text-align:center; margin-top:34px; letter-spacing:0.06em;
}
.status-line.error{color:var(--rust);}

@media (max-width:640px){
  .gauges{grid-template-columns:repeat(2,1fr);}
  .headline-stats{flex-wrap:wrap;}
  .hstat{min-width:45%;margin-bottom:12px;}
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-title">Howbinsea</div>
  <div class="login-subtitle">Connect your Adafruit IO feed to load the swing log</div>
  <div class="login-form">
    <div class="login-field">
      <label>Adafruit IO Username</label>
      <input type="text" id="loginUser" placeholder="your_username" autocomplete="off" autocapitalize="none"/>
    </div>
    <div class="login-field">
      <label>Adafruit IO Key</label>
      <input type="password" id="loginKey" placeholder="aio_xxxxxxxxxxxx" autocomplete="off" autocapitalize="none"/>
    </div>
    <div class="login-field">
      <label>Feed Key or ID</label>
      <input type="text" id="loginFeed" placeholder="3427570" value="3427570" autocomplete="off" autocapitalize="none"/>
    </div>
    <div class="login-field">
      <label>Lookback Window (hours)</label>
      <input type="number" id="loginLookback" placeholder="48" value="48" min="1" max="720"/>
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" onclick="doLogin()">Connect</button>
  </div>
  <button class="login-reset" onclick="resetCredentials()">clear saved credentials</button>
</div>

<div class="wrap">

  <div class="masthead">
    <div class="top-row">
      <div>
        <p class="eyebrow"><span class="status-dot"></span><span id="feedLabel">Feed &middot; Swing Sensor</span></p>
        <h1>Howbinsea</h1>
        <p class="subtitle" id="subtitleText">Wake &amp; wave motion, loading from Adafruit IO&hellip;</p>
      </div>
      <button class="refresh-btn" onclick="refresh(true)">&#8635; Refresh</button>
    </div>
    <div class="headline-stats" id="headlineStats"></div>
  </div>

  <p class="section-lbl">Activity Strip</p>
  <div class="chart-panel">
    <svg id="chart" viewBox="0 0 940 300" style="width:100%;height:auto;display:block;"></svg>
    <p class="chart-caption">
      <span class="swatch" style="background:var(--teal-dim)"></span>calm water, light wind
      <span class="swatch" style="background:#f5c442"></span>choppy water
      <span class="swatch" style="background:var(--rust);border-radius:50%;"></span>wake event
    </p>
  </div>

  <p class="section-lbl">Readout</p>
  <div class="gauges" id="gauges"></div>

  <p class="section-lbl" id="logSectionLbl">Event Log</p>
  <div class="log-panel">
    <table>
      <thead><tr><th>Time (PDT)</th><th>Reading</th><th>Δ From Baseline</th></tr></thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>

  <p class="status-line" id="statusLine">&nbsp;</p>
</div>

<script>
const TZ = 'America/Los_Angeles';
let AIO_USER = '', AIO_KEY = '', FEED_KEY = '', LOOKBACK_H = 48;
let autoRefreshTimer = null;
let lastPageCount = 0;

// ---------------- login / credentials ----------------
function doLogin(){
  const user = document.getElementById('loginUser').value.trim();
  const key = document.getElementById('loginKey').value.trim();
  const feed = document.getElementById('loginFeed').value.trim();
  const lookback = parseFloat(document.getElementById('loginLookback').value) || 48;
  if(!user || !key || !feed){
    document.getElementById('loginError').textContent = 'Username, key, and feed are required.';
    return;
  }
  AIO_USER = user; AIO_KEY = key; FEED_KEY = feed; LOOKBACK_H = lookback;
  localStorage.setItem('howbinsea_user', user);
  localStorage.setItem('howbinsea_key', key);
  localStorage.setItem('howbinsea_feed', feed);
  localStorage.setItem('howbinsea_lookback', String(lookback));
  document.getElementById('loginScreen').classList.add('hidden');
  refresh(true);
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(()=>refresh(false), 5*60*1000);
}

function resetCredentials(){
  ['howbinsea_user','howbinsea_key','howbinsea_feed','howbinsea_lookback'].forEach(k=>localStorage.removeItem(k));
  document.getElementById('loginUser').value = '';
  document.getElementById('loginKey').value = '';
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginScreen').classList.remove('hidden');
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !document.getElementById('loginScreen').classList.contains('hidden')) doLogin();
});

window.addEventListener('load', ()=>{
  const user = localStorage.getItem('howbinsea_user');
  const key = localStorage.getItem('howbinsea_key');
  const feed = localStorage.getItem('howbinsea_feed');
  const lookback = localStorage.getItem('howbinsea_lookback');
  if(user && key && feed){
    AIO_USER = user; AIO_KEY = key; FEED_KEY = feed; LOOKBACK_H = parseFloat(lookback) || 48;
    document.getElementById('loginFeed').value = feed;
    document.getElementById('loginLookback').value = LOOKBACK_H;
    document.getElementById('loginScreen').classList.add('hidden');
    refresh(true);
    autoRefreshTimer = setInterval(()=>refresh(false), 5*60*1000);
  }
});

// ---------------- Adafruit IO fetch + pagination ----------------
function toAioTime(date){
  // Adafruit IO expects "YYYY-MM-DD HH:MM:SS UTC", not raw ISO8601 —
  // feeding it ISO strings gets silently ignored, which re-fetches page 1 forever.
  const pad = n => String(n).padStart(2,'0');
  return `${date.getUTCFullYear()}-${pad(date.getUTCMonth()+1)}-${pad(date.getUTCDate())} `
       + `${pad(date.getUTCHours())}:${pad(date.getUTCMinutes())}:${pad(date.getUTCSeconds())} UTC`;
}

async function fetchPage(startTime, endTime){
  const params = new URLSearchParams();
  if(startTime) params.set('start_time', startTime);
  if(endTime) params.set('end_time', endTime);
  params.set('limit', '1000');
  const url = `https://io.adafruit.com/api/v2/${AIO_USER}/feeds/${FEED_KEY}/data?${params.toString()}`;
  const r = await fetch(url, { headers: { 'X-AIO-Key': AIO_KEY } });
  if(!r.ok) throw new Error(`Adafruit IO returned HTTP ${r.status}`);
  return await r.json();
}

async function fetchAllData(){
  const cutoff = new Date(Date.now() - LOOKBACK_H*3600*1000);
  let endTime = null;
  let all = [];
  let guard = 0;
  while(guard < 60){
    guard++;
    // deliberately no start_time here — some Adafruit IO accounts appear to
    // treat start_time as the anchor for sort order, which flips results to
    // oldest-first. Fetch newest-first unconditionally and stop client-side.
    const page = await fetchPage(null, endTime);
    if(!page.length) break;
    all = all.concat(page);

    const oldest = new Date(page[page.length-1].created_at);
    if(oldest <= cutoff || page.length < 1000){ lastPageCount = guard; break; }

    // step 1 second behind the oldest record in this page so the next
    // request can't overlap (and can't get stuck re-fetching the same page)
    endTime = toAioTime(new Date(oldest.getTime() - 1000));
    await new Promise(res=>setTimeout(res, 250));
  }
  lastPageCount = guard;

  const seen = new Set();
  const dedup = [];
  for(const d of all){
    if(new Date(d.created_at) < cutoff) continue;
    if(!seen.has(d.id)){ seen.add(d.id); dedup.push(d); }
  }
  dedup.sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
  return dedup;
}

// ---------------- time helpers (Pacific) ----------------
function fmt(date, opts){ return new Intl.DateTimeFormat('en-US', {timeZone:TZ, ...opts}).format(date); }
function dayKey(date){ return fmt(date, {year:'numeric',month:'numeric',day:'numeric'}); }
function weekdayHour(date){
  const wd = fmt(date, {weekday:'short'});
  const t = fmt(date, {hour:'numeric', minute:'2-digit', hour12:true});
  return `${wd} ${t}`;
}
function dayLabel(date){ return fmt(date, {month:'short', day:'numeric'}).toUpperCase(); }

// ---------------- main refresh ----------------
async function refresh(showLoading){
  const statusEl = document.getElementById('statusLine');
  if(showLoading){ statusEl.textContent = 'Loading from Adafruit IO…'; statusEl.classList.remove('error'); }
  try{
    const rows = await fetchAllData();
    if(!rows.length){
      statusEl.textContent = 'No data returned for this window.';
      statusEl.classList.add('error');
      return;
    }
    render(rows);
    statusEl.textContent = `Last synced ${weekdayHour(new Date())} PDT · ${rows.length.toLocaleString()} readings (${lastPageCount} page${lastPageCount===1?'':'s'}) · feed ${FEED_KEY}`;
    statusEl.classList.remove('error');
  }catch(e){
    console.error(e);
    statusEl.textContent = `Sync failed: ${e.message}`;
    statusEl.classList.add('error');
  }
}

// ---------------- render everything from live rows ----------------
function render(rows){
  const values = rows.map(r=>parseFloat(r.value));
  const dates = rows.map(r=>new Date(r.created_at));

  // baseline = most frequent value (rounded to 5 decimals to absorb float noise)
  const freq = new Map();
  values.forEach(v=>{
    const k = v.toFixed(5);
    freq.set(k, (freq.get(k)||0)+1);
  });
  let baseline = values[0], bestCount = 0;
  freq.forEach((count, k)=>{ if(count > bestCount){ bestCount = count; baseline = parseFloat(k); } });

  const t0 = dates[0];
  const tEnd = dates[dates.length-1];
  const durationH = (tEnd - t0) / 3600000;

  const points = rows.map((r,i)=>({ tmin:(dates[i]-t0)/60000, v: values[i]-baseline }));
  const events = rows.map((r,i)=>({ tmin:(dates[i]-t0)/60000, v: values[i]-baseline, raw: values[i], date: dates[i] }))
    .filter(e => Math.abs(e.v) > 0.0000005);

  const hourCount = Math.max(1, Math.ceil(durationH));
  const hourly = new Array(hourCount).fill(0);
  points.forEach(p=>{
    const idx = Math.min(hourCount-1, Math.floor(p.tmin/60));
    hourly[idx]++;
  });

  // ---- masthead ----
  document.getElementById('feedLabel').textContent = `Feed ${FEED_KEY} · Swing Sensor`;
  document.getElementById('subtitleText').innerHTML =
    `Wake &amp; wave motion, logged continuously from <b>${weekdayHour(t0)}</b> to <b>${weekdayHour(tEnd)}</b> PDT`;

  const maxCount = Math.max(...hourly);
  const minCount = Math.min(...hourly);
  const peakIdx = hourly.indexOf(maxCount);
  const quietIdx = hourly.indexOf(minCount);
  const peakHourDate = new Date(t0.getTime() + peakIdx*3600000);
  const quietHourDate = new Date(t0.getTime() + quietIdx*3600000);

  const headlineStats = [
    {num: durationH.toFixed(1), lbl:'Hours Logged'},
    {num: rows.length.toLocaleString(), lbl:'Readings'},
    {num: events.length, lbl:'Wake Events'},
    {num: weekdayHour(peakHourDate), lbl:'Busiest Hour'},
  ];
  document.getElementById('headlineStats').innerHTML = headlineStats.map(s=>
    `<div class="hstat"><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>`
  ).join('');

  // ---- gauges ----
  let maxDevPt = events.length ? events.reduce((a,b)=> Math.abs(b.v) > Math.abs(a.v) ? b : a) : null;
  const gauges = [
    {lbl:'Peak Choppy Traffic', val:`${maxCount}<small>readings / hr</small>`, sub:weekdayHour(peakHourDate), accent:false},
    {lbl:'Max Wake Event', val: maxDevPt ? `${Math.abs(maxDevPt.v).toFixed(3)}<small>vs baseline</small>` : '—', sub: maxDevPt ? weekdayHour(maxDevPt.date)+' PDT' : 'no deviations yet', accent:true},
    {lbl:'Quietest Stretch', val:`${minCount}<small>readings / hr</small>`, sub:weekdayHour(quietHourDate), accent:false},
    {lbl:'Baseline Reading', val: baseline.toFixed(3), sub:'steady pulse, proof of life', accent:false},
  ];
  document.getElementById('gauges').innerHTML = gauges.map(g=>
    `<div class="gauge${g.accent?' accent':''}"><div class="g-lbl">${g.lbl}</div><div class="g-val">${g.val}</div><div class="g-sub">${g.sub}</div></div>`
  ).join('');

  // ---- event log ----
  document.getElementById('logSectionLbl').textContent = `Event Log — ${events.length} Wake Event${events.length===1?'':'s'}`;
  document.getElementById('logBody').innerHTML = events.slice().reverse().map(e=>{
    return `<tr><td>${weekdayHour(e.date)}</td><td class="mono-val">${e.raw.toFixed(5)}</td><td class="dev-val">${Math.abs(e.v).toFixed(5)}</td></tr>`;
  }).join('') || `<tr><td colspan="3" style="color:var(--muted);">No wake events in this window.</td></tr>`;

  drawChart(points, events, hourly, durationH, t0);
}

// ---------------- chart ----------------
function drawChart(points, events, hourly, durationH, t0){
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById('chart');
  svg.innerHTML = '';
  const W = 940, H = 300;
  const padL = 34, padR = 12, padT = 14, padB = 34;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const hourCount = hourly.length;

  function xForHour(h){ return padL + (h/hourCount)*plotW; }
  function xForT(tmin){ return padL + (tmin/60/durationH)*plotW; }
  function el(tag, attrs){
    const e = document.createElementNS(svgNS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  const maxCount = Math.max(...hourly, 1);
  const barBaseY = padT + plotH*0.62;
  const barMaxH = plotH*0.62 - 4;
  hourly.forEach((c, i)=>{
    const bw = plotW/hourCount - 1.4;
    const bh = (c/maxCount) * barMaxH;
    const x = xForHour(i) + 0.7;
    const y = barBaseY - bh;
    const t = c/maxCount;
    const c1 = [36,90,102], c2 = [245,196,66];
    const rgb = c1.map((v,idx)=> Math.round(v + (c2[idx]-v)*t));
    svg.appendChild(el('rect', { x:x, y:y, width:Math.max(bw,1), height:Math.max(bh,1), fill:`rgb(${rgb.join(',')})`, opacity:0.88, rx:0.5 }));
  });
  svg.appendChild(el('line', {x1:padL, x2:W-padR, y1:barBaseY, y2:barBaseY, stroke:'#1c3f4c', 'stroke-width':1}));

  // day gridlines: mark where the local calendar day changes
  let lastDay = dayKey(t0);
  for(let h=1; h<hourCount; h++){
    const d = new Date(t0.getTime() + h*3600000);
    const dk = dayKey(d);
    if(dk !== lastDay){
      lastDay = dk;
      const x = xForHour(h);
      svg.appendChild(el('line', {x1:x, x2:x, y1:padT, y2:H-padB, stroke:'#1c3f4c', 'stroke-width':1, 'stroke-dasharray':'2,3'}));
      const t = el('text', {x:x+5, y:padT+10, fill:'#7fa0a8', 'font-size':9, 'letter-spacing':'0.08em'});
      t.textContent = dayLabel(d);
      svg.appendChild(t);
    }
  }

  const traceTop = padT + plotH*0.66;
  const traceBottom = H - padB - 2;
  const traceH = traceBottom - traceTop;
  const maxAbsDev = Math.max(0.001, ...points.map(p=>Math.abs(p.v)));
  function yForDev(v){ return traceBottom - (Math.abs(v)/maxAbsDev)*traceH; }

  svg.appendChild(el('line', {x1:padL, x2:W-padR, y1:traceBottom, y2:traceBottom, stroke:'#2a4d58', 'stroke-width':1}));

  let d = '';
  points.forEach((p,i)=>{
    const x = xForT(p.tmin);
    const y = yForDev(p.v);
    d += (i===0? 'M':'L') + x.toFixed(2) + ',' + y.toFixed(2) + ' ';
  });
  svg.appendChild(el('path', {d:d, fill:'none', stroke:'#3f9aa8', 'stroke-width':1.1, 'stroke-linejoin':'round'}));

  events.forEach(e=>{
    const x = xForT(e.tmin);
    const y = yForDev(e.v);
    svg.appendChild(el('circle', {cx:x, cy:y, r:3, fill:'#d9683d', stroke:'#081820', 'stroke-width':1}));
  });

  const lblActivity = el('text', {x:padL, y:padT+2, fill:'#7fa0a8', 'font-size':9, 'letter-spacing':'0.1em'});
  lblActivity.textContent = 'READINGS / HR';
  svg.appendChild(lblActivity);
  const lblTrace = el('text', {x:padL, y:traceTop-4, fill:'#7fa0a8', 'font-size':9, 'letter-spacing':'0.1em'});
  lblTrace.textContent = 'WAKE AMPLITUDE (ABS)';
  svg.appendChild(lblTrace);
}
</script>
</body>
</html>
